<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SkillShare Local</title>
  <script>
    // SPA redirect for GitHub Pages.
    // When GitHub Pages serves a 404 for a client-side route (e.g. /dashboard),
    // this page redirects to index.html with the original path encoded as a
    // query string. The script in index.html restores it before React Router boots.
    //
    // Technique: https://github.com/rafgraph/spa-github-pages
    var segmentCount = 1; // 1 = project repo (username.github.io/repo-name/)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>Redirecting…</body>
</html>
